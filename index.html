<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mostefa Salakdji — Senior Full Stack Java</title>
<meta name="description" content="Développeur senior full stack Java / Spring Boot / Angular / React — banque et e-commerce. Disponible en freelance, Île-de-France et remote.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;color:#0F172A;font-family:Inter,'Noto Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1D4ED8;text-decoration:none}a:hover{color:#1E40AF}
*{box-sizing:border-box}
.tip{position:relative}
.tipbox{display:none;position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:min(260px,80vw);background:#0F172A;color:#F8FAFC;font-size:13px;font-weight:400;line-height:1.5;padding:10px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.18);z-index:50;text-align:start;white-space:normal;pointer-events:none}
.tipbox::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#0F172A}
.tip:hover .tipbox,.tip:focus .tipbox,.tip:focus-visible .tipbox{display:block}
@media (max-width:640px){.tipbox{position:fixed;left:16px;right:16px;bottom:16px;top:auto;transform:none;width:auto;max-width:none;font-size:14px;padding:14px 16px}.tipbox::after{display:none}}
</style>

<style>html{scroll-behavior:smooth}h1{font-size:clamp(30px,6vw,44px)!important}</style>
</head>
<body>
<template id="tpl">

<div dir="{{dir}}" lang="{{lang}}" style="width: 100%; min-height: 100vh; background: #FFFFFF; color: #0F172A; font-family: Inter, 'Noto Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; align-items: stretch">

<!-- NAV -->
<header style="position: relative; width: 100%; border-bottom: 1px solid #E2E8F0; display: flex; justify-content: center">
<nav style="width: 100%; max-width: 1120px; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<a href="#top" style="font-weight: 700; font-size: 16px; color: #0F172A">Mostefa Salakdji</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; font-size: 14px; font-weight: 500">
<a href="#valeur" style="color: #475569">{{t.nav1}}</a>
<a href="#resultats" style="color: #475569">{{t.nav2}}</a>
<a href="#experiences" style="color: #475569">{{t.nav3}}</a>
<a href="#projets" style="color: #475569">{{t.nav4}}</a>
<a href="#contact" style="color: #475569">{{t.nav5}}</a>
<div style="display: flex; border: 1px solid #CBD5E1; border-radius: 8px; overflow: hidden; margin-inline-start: 8px" role="group" aria-label="Langue / Language / اللغة">
<button type="button" onClick="{{setFr}}" style="{{frBtn}}">FR</button>
<button type="button" onClick="{{setEn}}" style="{{enBtn}}">EN</button>
<button type="button" onClick="{{setAr}}" style="{{arBtn}}">عربي</button>
</div>
</div>
</nav>
</header>

<!-- HERO -->
<section id="top" style="width: 100%; display: flex; justify-content: center; padding: 64px 16px 48px; background: #F8FAFC; border-bottom: 1px solid #E2E8F0">
<div style="width: 100%; max-width: 1120px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #1D4ED8; background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 999px; padding: 6px 12px">
<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="#1D4ED8"></circle></svg>
{{t.available}}
</span>
<span style="font-size: 13px; color: #64748B; border: 1px solid #E2E8F0; background: #FFFFFF; border-radius: 999px; padding: 6px 12px">{{t.location}}</span>
</div>
<h1 style="margin: 0; font-size: 44px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; max-width: 900px">{{t.heroTitle}}</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55; color: #334155; max-width: 800px">{{t.heroText}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{heroTags}}" as="h" hint-placeholder-count="5">
<sc-if value="{{h.has}}" hint-placeholder-val="{{true}}"><button type="button" class="tip" style="display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-size: 14px; font-weight: 500; color: #334155; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 8px; padding: 6px 12px; cursor: help">{{h.label}}<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg><span class="tipbox" role="tooltip">{{h.info}}</span></button></sc-if>
<sc-if value="{{h.notip}}" hint-placeholder-val="{{false}}"><span style="font-size: 14px; font-weight: 500; color: #334155; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 8px; padding: 6px 12px">{{h.label}}</span></sc-if>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; color: #64748B">{{t.tipHint}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px">
<a href="mailto:SalakdjiMostefa@gmail.com" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; background: #1D4ED8; color: #FFFFFF; font-weight: 600; font-size: 15px; border-radius: 10px">{{t.ctaContact}}</a>
<a href="#resultats" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 15px; border-radius: 10px; border: 1px solid #CBD5E1">{{t.ctaResults}}</a>
</div>
</div>
</section>

<!-- REFERENCES -->
<section style="width: 100%; display: flex; justify-content: center; padding: 36px 16px; border-bottom: 1px solid #E2E8F0">
<div style="width: 100%; max-width: 1120px; display: flex; flex-direction: column; align-items: center; gap: 18px">
<div style="font-size: 13px; font-weight: 600; color: #64748B; letter-spacing: 0.06em; text-transform: uppercase">{{t.refLabel}}</div>
<div style="width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<sc-for list="{{clients}}" as="c" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 20px 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: 160px; height: 48px; display: block; overflow: hidden"><img src="{{c.logo}}" alt="{{c.n}}" style="display: block; width: 160px; height: 48px; object-fit: contain; object-position: center"></div>
<span style="font-size: 12px; color: #64748B; text-align: center">{{c.s}}</span>
</div>
</sc-for>
</div>
</div>
</section>

<!-- CE QUE J'APPORTE -->
<section id="valeur" style="width: 100%; display: flex; justify-content: center; padding: 64px 16px 56px">
<div style="width: 100%; max-width: 1120px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8; letter-spacing: 0.06em; text-transform: uppercase">{{t.valueLabel}}</div>
<h2 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">{{t.valueTitle}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #475569; max-width: 760px">{{t.valueIntro}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{values}}" as="v" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 18px; font-weight: 700">{{v.h}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #334155">{{v.business}}</p>
<div style="margin-top: 4px; padding-top: 10px; border-top: 1px dashed #E2E8F0; font-size: 13px; line-height: 1.5; color: #64748B"><span style="font-weight: 600; color: #475569">{{t.techLabel}}</span> {{v.tech}}</div>
</div>
</sc-for>
</div>
</div>
</section>

<!-- TECHNOLOGIES -->
<section style="width: 100%; display: flex; justify-content: center; padding: 0 16px 64px">
<div style="width: 100%; max-width: 1120px; display: flex; flex-direction: column; gap: 20px">
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8; letter-spacing: 0.06em; text-transform: uppercase">{{t.techStripLabel}}</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px">
<sc-for list="{{techs}}" as="tc" hint-placeholder-count="16">
<button type="button" class="tip" style="font-family: inherit; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: help">
<img src="{{tc.src}}" alt="" style="width: 32px; height: 32px; object-fit: contain">
<span style="display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: #334155; text-align: center">{{tc.n}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></span>
<span class="tipbox" role="tooltip">{{tc.info}}</span>
</button>
</sc-for>
</div>
</div>
</section>

<!-- RESULTATS -->
<section id="resultats" style="width: 100%; display: flex; justify-content: center; padding: 0 16px 64px">
<div style="width: 100%; max-width: 1120px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8; letter-spacing: 0.06em; text-transform: uppercase">{{t.resultsLabel}}</div>
<h2 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">{{t.resultsTitle}}</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px">
<sc-for list="{{results}}" as="r" hint-placeholder-count="6">
<div style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em; color: #1D4ED8">{{r.n}}</div>
<div style="font-size: 15px; font-weight: 600; color: #0F172A">{{r.h}}</div>
<div style="font-size: 14px; line-height: 1.55; color: #475569">{{r.p}}</div>
<div style="font-size: 12px; color: #64748B">{{r.where}}</div>
</div>
</sc-for>
</div>
</div>
</section>

<!-- EXPERIENCES -->
<section id="experiences" style="width: 100%; display: flex; justify-content: center; padding: 0 16px 64px">
<div style="width: 100%; max-width: 1120px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8; letter-spacing: 0.06em; text-transform: uppercase">{{t.expLabel}}</div>
<h2 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">{{t.expTitle}}</h2>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{exps}}" as="e" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h3 style="margin: 0; font-size: 22px; font-weight: 700">{{e.co}}</h3>
<div style="font-size: 15px; color: #475569">{{e.role}}</div>
</div>
<div style="font-size: 14px; font-weight: 500; color: #64748B; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 6px 12px">{{e.when}}</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px 32px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8; text-transform: uppercase; letter-spacing: 0.04em">{{t.contextLabel}}</div>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #334155">{{e.context}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8; text-transform: uppercase; letter-spacing: 0.04em">{{t.impactLabel}}</div>
<ul style="margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.55; color: #1E293B">
<sc-for list="{{e.items}}" as="it" hint-placeholder-count="4">
<li>{{it}}</li>
</sc-for>
</ul>
</div>
</div>
<div style="padding-top: 14px; border-top: 1px dashed #E2E8F0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #475569; margin-right: 4px">{{t.stackLabel}}</span>
<sc-for list="{{e.tags}}" as="tg" hint-placeholder-count="6">
<sc-if value="{{tg.has}}" hint-placeholder-val="{{true}}"><button type="button" class="tip" style="display: inline-flex; align-items: center; gap: 5px; font-family: inherit; font-size: 12px; color: #334155; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 4px 8px; cursor: help">{{tg.label}}<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg><span class="tipbox" role="tooltip">{{tg.info}}</span></button></sc-if>
<sc-if value="{{tg.notip}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #334155; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 4px 8px">{{tg.label}}</span></sc-if>
</sc-for>
</div>
</article>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #64748B">{{t.expMore}}</p>
</div>
</section>

<!-- PROJETS PERSO -->
<section id="projets" style="width: 100%; display: flex; justify-content: center; padding: 0 16px 64px">
<div style="width: 100%; max-width: 1120px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8; letter-spacing: 0.06em; text-transform: uppercase">{{t.projLabel}}</div>
<h2 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">{{t.projTitle}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #475569; max-width: 760px">{{t.projIntro}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="2">
<article style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8">{{p.kind}}</div>
<h3 style="margin: 0; font-size: 22px; font-weight: 700">{{p.name}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #334155">{{p.desc}}</p>
<sc-if value="{{p.hasShots}}" hint-placeholder-val="{{false}}"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{p.shots}}" as="sh" hint-placeholder-count="2">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 6px">
<img src="{{sh.src}}" alt="{{sh.cap}}" style="display: block; width: 100%; aspect-ratio: 9 / 14; object-fit: cover; object-position: top; border-radius: 14px; border: 1px solid #E2E8F0; background: #F8FAFC">
<figcaption style="font-size: 12px; color: #64748B; text-align: center">{{sh.cap}}</figcaption>
</figure>
</sc-for>
</div></sc-if>
<ul style="margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.55; color: #1E293B">
<sc-for list="{{p.items}}" as="pi" hint-placeholder-count="4">
<li>{{pi}}</li>
</sc-for>
</ul>
<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px">
<sc-for list="{{p.tags}}" as="pt" hint-placeholder-count="5">
<sc-if value="{{pt.has}}" hint-placeholder-val="{{true}}"><button type="button" class="tip" style="display: inline-flex; align-items: center; gap: 5px; font-family: inherit; font-size: 12px; color: #334155; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 4px 8px; cursor: help">{{pt.label}}<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg><span class="tipbox" role="tooltip">{{pt.info}}</span></button></sc-if>
<sc-if value="{{pt.notip}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #334155; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 4px 8px">{{pt.label}}</span></sc-if>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px">
<sc-for list="{{p.links}}" as="lk" hint-placeholder-count="2">
<a href="{{lk.href}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; background: #1D4ED8; color: #FFFFFF; font-weight: 600; font-size: 14px; border-radius: 10px">{{lk.label}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a>
</sc-for>
</div>
</article>
</sc-for>
</div>
<div style="background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 16px; padding: 24px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 18px; font-weight: 700">{{t.proBonoTitle}}</div>
<div style="font-size: 15px; line-height: 1.6; color: #334155">{{t.proBonoText}}</div>
</div>
<a href="mailto:SalakdjiMostefa@gmail.com" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; color: #1D4ED8; font-weight: 600; font-size: 14px; border-radius: 10px; border: 1px solid #BFDBFE; background: #FFFFFF">{{t.proBonoCta}}</a>
</div>
</div>
</section>

<!-- METHODE + FORMATION -->
<section style="width: 100%; display: flex; justify-content: center; padding: 0 16px 64px">
<div style="width: 100%; max-width: 1120px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px 40px; border-top: 1px solid #E2E8F0; padding-top: 40px">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8; letter-spacing: 0.06em; text-transform: uppercase">{{t.howLabel}}</div>
<ul style="margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #334155">
<sc-for list="{{how}}" as="hw" hint-placeholder-count="4">
<li>{{hw}}</li>
</sc-for>
</ul>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8; letter-spacing: 0.06em; text-transform: uppercase">{{t.eduLabel}}</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 16px; font-weight: 600">{{t.edu1}}</div>
<div style="font-size: 14px; color: #64748B">CNAM, 2018</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 16px; font-weight: 600">{{t.edu2}}</div>
<div style="font-size: 14px; color: #64748B">Université Bachir El Ibrahimi, 2017</div>
</div>
<div style="font-size: 13px; font-weight: 600; color: #1D4ED8; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 6px">{{t.langLabel}}</div>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #334155">{{t.langText}}</p>
</div>
</div>
</section>

<!-- CONTACT -->
<section id="contact" style="width: 100%; display: flex; justify-content: center; padding: 0 16px 72px">

const comp = new Component({ lang: 'fr' });
function get(scope, path){ path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  return path.split('.').reduce((o,k)=> o==null ? undefined : o[k], scope); }
function interp(str, scope){
  const m = str.match(/^\{\{([^}]+)\}\}$/);
  if (m) return get(scope, m[1]);
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = get(scope, p); return v == null ? '' : v; }); }
function build(node, scope, parent){
  if (node.nodeType === 3){ parent.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for'){
    const list = interp(node.getAttribute('list'), scope) || []; const as = node.getAttribute('as');
    list.forEach((item, i) => { const s = Object.assign({}, scope, {[as]: item, $index: i});
      node.childNodes.forEach(c => build(c, s, parent)); }); return; }
  if (tag === 'sc-if'){ if (interp(node.getAttribute('value'), scope)) node.childNodes.forEach(c => build(c, scope, parent)); return; }
  const el = node.namespaceURI === 'http://www.w3.org/1999/xhtml' ? document.createElement(node.localName) : document.createElementNS(node.namespaceURI, node.localName);
  for (const a of node.attributes){
    if (a.name === 'onclick'){ const fn = interp(a.value, scope); if (typeof fn === 'function') el.addEventListener('click', fn); continue; }
    if (a.name.startsWith('hint-')) continue;
    el.setAttribute(a.name, interp(a.value, scope)); }
  const kids = tag === 'template' ? node.content.childNodes : node.childNodes;
  kids.forEach(c => build(c, scope, el)); parent.appendChild(el); }
function render(){
  const app = document.getElementById('app'); const y = window.scrollY;
  const frag = document.createDocumentFragment();
  const vals = comp.renderVals();
  document.getElementById('tpl').content.childNodes.forEach(c => build(c, vals, frag));
  app.replaceChildren(frag); document.documentElement.lang = vals.t && vals.t.nav5 && comp.state.lang ? comp.state.lang : document.documentElement.lang;
  window.scrollTo(0, y); }
render();
